<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/cuelistr-icon.svg">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/manifest-kiosk.webmanifest">
    <meta name="theme-color" content="#121212">
    <script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); }); }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khula:wght@600&display=swap">
    <title>Cuelistr Kiosk</title>
    <style>
        /* No blue tap/click highlight on buttons (keyboard focus rings are kept for accessibility) */
        * { -webkit-tap-highlight-color: transparent; }
        button, [role="button"], [role="switch"], select, summary, label.toggle, .btn, .pill-btn, .toggle-btn, .utility-btn, .primary-btn { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        button:focus:not(:focus-visible), [role="button"]:focus:not(:focus-visible), [role="switch"]:focus:not(:focus-visible) { outline: none; }

        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --red-action: #e91429;
        
            --text: #ffffff;
            --text-muted: #a7a7a7;
            --border: #282828;
            --border-strong: #333333;
            --hover-bg: #2c2c2c;
            --overlay-soft: rgba(255,255,255,0.08);
            --stage-bg: #000000;
            --inset-bg: #1c1c1c;
            --text-soft: #cccccc;
        }



        html { overflow-x: hidden; }
        body {
            background-color: var(--spotify-black);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            min-height: 100vh;
            overflow-x: hidden;
            /* Safety net: any text that isn't explicitly truncated (song
               titles, usernames, etc.) wraps onto a new line instead of
               pushing its box wider than the screen. */
            overflow-wrap: break-word;
            word-break: break-word;
        }
        * { box-sizing: border-box; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Pinned top bar (header never scrolls away) ---
           position: fixed instead of sticky: html/body have overflow-x: hidden, which
           makes sticky unreliable. The page content is pushed down by --fixed-header-h,
           which a tiny script at the bottom keeps equal to the header's real height
           (it changes with 1-2 line titles, the venue subtitle, display-only mode...). */
        :root { --fixed-header-h: 72px; --page-max: 800px; }
        body { padding-top: 0; }
        .container { padding-top: calc(var(--fixed-header-h) + 6px); }
        /* One solid pinned block: header + search bar + "Up Next" title. Only the song list scrolls. */
        .pinned-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 600;
            background-color: var(--spotify-black);
            padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, calc((100% - var(--page-max)) / 2)) 8px;
        }
        .pinned-top .header { margin-bottom: 10px; }
        .pinned-top .search-bar-wrapper { margin-bottom: 10px; }
        .pinned-top .section-title-row { margin-bottom: 0; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-wrap: nowrap;
            gap: 15px;
        }

        /* min-width: 0 + ellipsis lets the title shrink/truncate on narrow
           screens instead of wrapping onto a new line - that wrap was what
           pushed the credits box down below the title. Truncating keeps the
           credits box pinned in the header row, top-right, at every width. */
        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
            font-family: 'Khula', sans-serif;
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .credits-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .top-pill-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Shared pill style - the credits display and Connect Spotify button
           use this exact same class so they always stay the same size.
           Was a fixed 190px, which is wider than the available space on
           common phones (two side by side exceeds an iPhone 14's 390px
           width once padding is subtracted) - now scales with viewport
           width instead, capping at 190px on larger screens. */
        .pill-btn {
            background-color: var(--panel-bg);
            padding: 10px 16px;
            border-radius: 50px;
            font-weight: 700;
            border: 1px solid var(--border);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            width: min(190px, 44vw);
            min-width: 0;
            text-align: center;
        }

        .credits-display { color: var(--text); }

        .connect-spotify-btn {
            background-color: black;
            color: var(--spotify-green);
            border: 1px solid var(--spotify-green);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .connect-spotify-btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
        .connect-spotify-btn:hover { background-color: var(--inset-bg); }
        .connect-spotify-btn.is-connected {
            color: white;
            background-color: var(--spotify-green);
            border-color: var(--spotify-green);
        }
        .connect-spotify-btn.is-connected:hover { background-color: #1ed760; }

        .credit-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* Compact "number over label" badge, e.g. a big "1" over small "CREDIT" -
           replaces the old full-width "Credits: X / Y" pill. */
        .credit-badge {
            background-color: var(--inset-bg);
            border: 1px solid var(--hover-bg);
            border-radius: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            padding: 0 2px;
            gap: 1px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .credit-badge-number {
            font-size: 1.15rem;
            font-weight: 400;
            line-height: 1;
            color: var(--text);
            white-space: nowrap;
        }
        .credit-badge-label {
            font-size: 0.46rem;
            font-weight: 700;
            letter-spacing: 0.1px;
            color: var(--text-muted);
            line-height: 1;
            white-space: nowrap;
        }

        .search-bar-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
        }

        .search-box {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-strong);
            padding: 14px 20px;
            color: var(--text);
            border-radius: 50px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 0;
            transition: all 0.2s ease, padding 0.15s ease;
        }
        .search-box:focus { border-color: var(--spotify-green); }
        .search-box.has-inline-btn { padding-right: 150px; }

        /* Disabled search state styling */
        .search-box:disabled {
            background-color: var(--inset-bg);
            border-color: var(--border);
            color: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .inline-playlists-btn {
            display: none;
            position: absolute;
            top: 6px;
            right: 6px;
            bottom: 6px;
            align-items: center;
            justify-content: center;
            background-color: var(--spotify-green);
            color: white;
            border: 1px solid var(--spotify-green);
            padding: 0 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: filter 0.15s ease;
        }
        .inline-playlists-btn:hover { filter: brightness(1.1); }
        .inline-playlists-btn.is-visible { display: flex; }

        @media (max-width: 400px) {
            .search-box.has-inline-btn { padding-right: 128px; }
            .inline-playlists-btn { padding: 0 12px; font-size: 0.8rem; }
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--spotify-green);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .section-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .section-title-row .section-title { margin-bottom: 0; }

        .my-requests-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-strong);
            padding: 7px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .my-requests-btn:hover { color: var(--text); border-color: #555; }

        .my-request-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: var(--card-bg);
        }
        .my-request-row img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
        .my-request-text { flex: 1; min-width: 0; }
        .my-request-text p { margin: 0; }
        .my-request-title { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .my-request-artist { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .status-pill {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-queued { background-color: rgba(29, 185, 84, 0.15); color: var(--spotify-green); }
        .status-played { background-color: rgba(167, 167, 167, 0.15); color: var(--text-muted); }
        .status-removed { background-color: rgba(233, 20, 41, 0.15); color: var(--red-action); }

        .song-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--card-bg);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid var(--hover-bg);
            gap: 16px;
            box-sizing: border-box;
            width: 100%;
        }

        .song-details {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .song-details img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .text-block {
            flex: 1;
            min-width: 0;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .song-title {
            font-weight: 700;
            margin: 0;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .explicit-badge {
            background-color: #7f7f7f;
            color: var(--spotify-black);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 2px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            line-height: 1;
        }

        .song-artist {
            color: var(--text-muted);
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .vote-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 34px;
        }

        .vote-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        .vote-btn:active { transform: scale(0.8); }

        .vote-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke-width: 2;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }

        .vote-btn-up svg { stroke: #666; }

        .vote-node.user-voted-up .vote-btn-up svg { stroke: var(--spotify-green); fill: var(--spotify-green); }

        .vote-count {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 4px;
            color: var(--text-muted);
            text-align: center;
        }
        .user-voted-up .vote-count { color: var(--spotify-green); }
        .user-voted-down .vote-count { color: var(--red-action); }

        .btn-request {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.1s ease;
        }
        .btn-request:active { transform: scale(0.95); }
        .btn-request:disabled { background-color: var(--border-strong); cursor: default; }

        .empty-placeholder { color: #666; font-style: italic; text-align: center; padding: 20px 0; }

        /* PLAYLIST MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            /* If the box is ever taller than the viewport (e.g. landscape
               phone with the keyboard open), scroll instead of clipping. */
            overflow-y: auto;
        }
        .modal-overlay.is-visible { display: flex; }

        .modal-box {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .modal-back-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;
            display: none; align-items: center; justify-content: center;
        }
        .modal-back-btn.is-visible { display: flex; }
        .modal-back-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .modal-title { font-weight: 800; font-size: 1.1rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .modal-close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.3rem; padding: 4px 8px; line-height: 1; }
        .modal-close-btn:hover { color: var(--text); }

        .modal-body { overflow-y: auto; padding: 16px 20px; }

        .playlist-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: background-color 0.15s ease;
        }
        .playlist-row:hover { background-color: var(--card-bg); }
        .playlist-row img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--border-strong); }
        .playlist-row .pl-name { font-weight: 700; font-size: 0.95rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-row .pl-count { font-size: 0.8rem; color: var(--text-muted); margin: 2px 0 0 0; }

        .modal-loading, .modal-empty { color: var(--text-muted); text-align: center; padding: 30px 10px; font-style: italic; }

        /* USERNAME PROMPT MODAL */
        .username-modal-box {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .username-modal-box h3 { margin: 0 0 8px 0; font-size: 1.2rem; }
        .username-modal-box p { margin: 0 0 16px 0; color: var(--text-muted); font-size: 0.9rem; }
        .username-input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-strong);
            padding: 12px 16px;
            color: var(--text);
            border-radius: 50px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 14px;
            text-align: center;
        }
        .username-input:focus { border-color: var(--spotify-green); }
        .username-save-btn {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        @media (max-width: 400px) {
            .song-row { padding: 10px; gap: 10px; }
            .btn-request { padding: 8px 14px; font-size: 0.8rem; }
            .pill-btn { padding: 9px 14px; font-size: 0.9rem; width: 150px; }
        }

        /* Toast notifications - replace blocking alert() popups */
        #toast-container {
            position: fixed; top: max(24px, env(safe-area-inset-top, 24px)); left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 8px;
            align-items: center; width: 100%; padding: 0 16px; box-sizing: border-box;
            pointer-events: none;
        }
        .toast {
            background: var(--card-bg); color: var(--text); border: 1px solid var(--border-strong);
            border-left: 4px solid var(--spotify-green, var(--spotify-green));
            border-radius: 8px; padding: 12px 18px; font-size: 0.9rem; font-weight: 600;
            max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            opacity: 0; transform: translateY(-12px); transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .toast-error { border-left-color: var(--red-action); }
        .toast-visible { opacity: 1; transform: translateY(0); }

        /* --- Display-Only Mode: full-screen read-only queue board --- */
        body.kiosk-display-only .credits-container,
        body.kiosk-display-only .search-bar-wrapper {
            display: none !important;
        }
        body.kiosk-display-only { --page-max: 1100px; }
        body.kiosk-display-only .container {
            max-width: 1100px;
        }
        body.kiosk-display-only .header {
            justify-content: center;
            border-bottom: none;
        }
        body.kiosk-display-only h1 {
            font-size: 3rem;
            text-align: center;
        }
        body.kiosk-display-only .section-title-row {
            justify-content: center;
        }
        body.kiosk-display-only .section-title {
            font-size: 1.8rem;
        }
        body.kiosk-display-only #main-display-list .song-row {
            padding: 20px 22px;
        }
        body.kiosk-display-only #main-display-list .song-details img {
            width: 68px;
            height: 68px;
        }
        body.kiosk-display-only #main-display-list .song-title {
            font-size: 1.5rem;
        }
        body.kiosk-display-only #main-display-list .song-artist {
            font-size: 1.15rem;
        }
        /* Read-only: no voting on a board nobody's meant to touch */
        body.kiosk-display-only #main-display-list .actions {
            display: none !important;
        }

        /* --- Now Playing bar (live from Spotify) --- */
        .now-playing-bar {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 60px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: none;
            align-items: center;
            gap: 10px;
            padding: 0 10px 0 16px;
            box-sizing: border-box;
            z-index: 500;
            overflow: hidden;
            /* Pinned + solid: always glued to the bottom edge, never see-through,
               sits on its own layer so it doesn't wobble while the page scrolls. */
            background-color: var(--panel-bg);
            transform: translateZ(0);
            will-change: transform;
            height: calc(60px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .now-playing-bar.is-visible { display: flex; }
        .now-playing-progress-track {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background-color: var(--overlay-soft);
        }
        .now-playing-progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--spotify-green);
            /* No CSS transition here on purpose - a transition made the bar
               visibly animate/slide backwards for a moment every time a new
               track started (jumping from ~100% down to ~0%). Setting the
               width directly in JS on every tick keeps it snapping straight
               to the correct spot instead. */
        }
        .now-playing-artwork {
            width: 40px; height: 40px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: var(--card-bg);
        }
        .now-playing-text { flex: 1; min-width: 0; }
        .now-playing-title {
            margin: 0; font-weight: 700; font-size: 0.85rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .now-playing-artist {
            margin: 2px 0 0 0; font-size: 0.75rem; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .now-playing-live-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: var(--spotify-green);
            flex-shrink: 0;
            animation: now-playing-pulse 1.5s ease-in-out infinite;
        }
        .now-playing-live-dot.is-paused { animation: none; opacity: 0.3; }
        @keyframes now-playing-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        body.has-now-playing-bar { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }

    </style>
</head>
<body>

    <div class="container">
        <div class="pinned-top">
        <div class="header">
            <h1 id="event-name-header">Cuelistr</h1>
            <div class="credits-container">
                <div class="top-pill-row">
                    <div class="credit-block">
                        <div id="credits-status" class="credit-badge">
                            <div id="credit-badge-number" class="credit-badge-number">--</div>
                            <div id="credit-badge-label" class="credit-badge-label">Credits</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="search-bar-wrapper">
            <input type="text" id="search-input" class="search-box" placeholder="Search for songs or artists..." oninput="executeSearch()">
        </div>

        <div class="section-title-row">
            <div class="section-title" id="list-title">Up Next</div>
        </div>
        </div>
        <div id="main-display-list"></div>
    </div>

    <!-- MY REQUESTS MODAL removed on kiosk - not needed for a shared device -->

    <!-- USERNAME PROMPT MODAL removed on kiosk - always requests as android_kiosk -->

    <script>
        // This page is served at /e/{slug}/kiosk, so the event's slug is
        // always the second path segment - every relative API call below
        // goes through eventUrl() so it hits the right event's data.
        // Works two ways: /e/{slug}/kiosk (old links, the admin "open kiosk" button) or the
        // slugless /kiosk (the installed app), which uses the event this device last opened/picked.
        const KIOSK_EVENT_KEY = 'cuelistr_kiosk_event';
        const PATH_SLUG = location.pathname.split('/')[1] === 'e' ? (location.pathname.split('/')[2] || '') : '';
        const EVENT_SLUG = PATH_SLUG || (function () { try { return localStorage.getItem(KIOSK_EVENT_KEY) || ''; } catch (e) { return ''; } })();
        if (PATH_SLUG) { try { localStorage.setItem(KIOSK_EVENT_KEY, PATH_SLUG); } catch (e) { /* storage blocked */ } }
        function eventUrl(p) { return `/e/${EVENT_SLUG}${p}`; }

        // Toast notifications - non-blocking replacement for alert()
        let toastTimer = null;
        function showToast(message, type = "error") {
            const container = document.getElementById("toast-container");
            if (!container) { console.log(message); return; }
            container.innerHTML = "";
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add("toast-visible"));
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove("toast-visible");
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Updates the compact "number over label" credit badge - singular/plural
        // aware, matching the "1 / CREDIT" style badge design.
        function updateCreditBadge(count) {
            const numEl = document.getElementById('credit-badge-number');
            const labelEl = document.getElementById('credit-badge-label');
            if (!numEl || !labelEl) return;
            numEl.innerText = count;
            // Only touch the label when full. While recharging, startLocalCountdown()
            // owns this same label and writes the countdown into it instead - so the
            // two never fight over what's displayed there.
            if (count >= maxCredits) {
                labelEl.innerText = count === 1 ? 'CREDIT' : 'CREDITS';
            }
        }
        function artistWithYear(artist, year) { return year ? `${artist} (${year})` : artist; } // e.g. Calvin Harris (2011)
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Artwork URLs come from Spotify (trusted) but were being inserted into
        // <img src="..."> attributes with no validation at all. This only allows
        // actual http(s) URLs through - anything else (e.g. a stray quote that
        // could break out of the attribute, or a javascript: URL) falls back to
        // the same placeholder used elsewhere instead of being trusted blindly.
        function safeImageUrl(url) {
            if (typeof url !== 'string') return 'https://picsum.photos/48';
            try {
                const parsed = new URL(url, window.location.origin);
                if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return 'https://picsum.photos/48';
                return escapeHtml(parsed.href);
            } catch (e) {
                return 'https://picsum.photos/48';
            }
        }

        let availableCredits = 3;
        let maxCredits = 3;
        let searchTimeout = null;
        let timeRemaining = 60;
        let countdownTimer = null;
        let currentServerDuration = 60;
        let globalSearchResults = [];
        let systemRequestsAllowed = true; // Local tracker for global toggling
        let explicitBlockActive = false;
        let queueIsFull = false; // Auto-close from the DJ's queue length cap, distinct from a manual close
        let isBlockedGuest = false; // This kiosk device specifically blocked via the admin Blocked tab
        let lastGuestQueue = [];
        let spotifyUpcomingQueue = [];

        if (!localStorage.getItem('voterSignatureToken')) {
            localStorage.setItem('voterSignatureToken', 'voter_' + Math.random().toString(36).substr(2, 9));
        }
        const voterSignatureToken = localStorage.getItem('voterSignatureToken');

        // --- Kiosk identity: fixed, no per-guest prompt (this is a shared device) ---
        let guestUsername = 'android_kiosk';

        async function fetchSystemState() {
            if (!EVENT_SLUG) return; // no event chosen yet - the picker below is showing
            try {
                const res = await fetch(eventUrl('/kiosk-data'));
                if (res.status === 404) { try { localStorage.removeItem(KIOSK_EVENT_KEY); } catch (e) { /* ignore */ } location.replace('/kiosk'); return; } // saved event was deleted
                if (!res.ok) return;
                const data = await res.json();

                maxCredits = data.maxCredits;
                currentServerDuration = data.countdownLength;
                systemRequestsAllowed = data.requestsAllowed;
                explicitBlockActive = data.explicitBlockActive || false;
                queueIsFull = data.queueFull || false;
                isBlockedGuest = data.blocked || false;

                // "Display-Only Mode" (set from Admin > Kiosk Page settings): strips
                // this down to a full-screen, read-only Up Next board - no search,
                // no credits, no voting. CSS does the actual hiding; this just toggles
                // the class so it responds live if the DJ flips it mid-event.
                document.body.classList.toggle('kiosk-display-only', !!data.displayOnlyMode);

                const nameHeader = document.getElementById('event-name-header');
                const newName = (data.eventName && data.eventName.trim() !== '') ? data.eventName.trim() : 'Cuelistr';
                if (nameHeader.innerText !== newName) {
                    nameHeader.innerText = newName;
                    // Tab title stays "Kiosk" here (unlike the guest page) so it's
                    // easy to spot this tab among others on the kiosk device.
                }

                setupLocalCredits();
                manageCountdownVisibility();

                // Live lock/unlock layout handling. Requests can be closed two ways:
                // the DJ manually pausing them, or the queue length cap auto-closing
                // once it hits the configured max - each gets its own message.
                const searchInput = document.getElementById('search-input');
                const effectivelyOpen = systemRequestsAllowed && !queueIsFull && !isBlockedGuest;
                if (!effectivelyOpen) {
                    searchInput.disabled = true;
                    searchInput.value = "";
                    searchInput.placeholder = isBlockedGuest
                        ? "Requests unavailable now"
                        : queueIsFull
                        ? "Queue is full right now — wait for songs to play, it'll reopen automatically."
                        : "Song submissions are currently paused by the admin.";
                    document.getElementById('list-title').innerText = "Up Next";
                    renderQueue(data.queue);
                } else {
                    if (searchInput.disabled) {
                        searchInput.disabled = false;
                        searchInput.placeholder = "Search for songs or artists...";
                    }

                    if (searchInput.value.trim() === "") {
                        document.getElementById('list-title').innerText = "Up Next";
                        renderQueue(data.queue);
                    }
                }
            } catch (e) { console.log("State sync failure."); }
        }

        function setupLocalCredits() {
            if (localStorage.getItem('userCredits') === null) {
                localStorage.setItem('userCredits', maxCredits);
            }
            availableCredits = parseInt(localStorage.getItem('userCredits'));

            if (availableCredits > maxCredits) {
                availableCredits = maxCredits;
                localStorage.setItem('userCredits', availableCredits);
            }

            updateCreditBadge(availableCredits);
        }

        function manageCountdownVisibility() {
            if (availableCredits >= maxCredits) {
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
                updateCreditBadge(availableCredits); // makes sure the Credit(s) word is showing
            } else {
                startLocalCountdown();
            }
        }

        // Writes the recharge countdown straight into the badge's label spot
        // (where "Credit"/"Credits" normally sits), so it's just a bare
        // number-of-seconds like "43s" - no "Next Credit:" prefix. Once
        // credits refill back to max, the label reverts to the word via
        // updateCreditBadge().
        function startLocalCountdown() {
            if (countdownTimer) return;
            beginCountdownTimer();
        }

        // Forces the countdown back to the full duration, even if one was
        // already running - used right after a credit is actually spent, so
        // using a second credit mid-countdown resets the wait instead of
        // keeping whatever time was left.
        function restartLocalCountdown() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            beginCountdownTimer();
        }

        function beginCountdownTimer() {
            const labelEl = document.getElementById('credit-badge-label');
            const numEl = document.getElementById('credit-badge-number');
            timeRemaining = currentServerDuration;
            if (labelEl) labelEl.innerText = `${timeRemaining}s`;

            countdownTimer = setInterval(() => {
                timeRemaining--;

                if (timeRemaining <= 0) {
                    timeRemaining = currentServerDuration;
                    if (availableCredits < maxCredits) {
                        availableCredits++;
                        localStorage.setItem('userCredits', availableCredits);
                        if (numEl) numEl.innerText = availableCredits;
                    }
                }

                if (availableCredits >= maxCredits) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    updateCreditBadge(availableCredits);
                } else if (labelEl) {
                    labelEl.innerText = `${timeRemaining}s`;
                }
            }, 1000);
        }

        function renderQueue(queue) {
            if (queue) lastGuestQueue = queue;

            // The now-playing poll calls this every few seconds to refresh
            // the Spotify continuation rows - but if search results are
            // currently on screen, overwriting #main-display-list here
            // would yank those results away a few seconds after they
            // appeared. Only render the Up Next view when that's
            // actually what's on screen.
            const searchInput = document.getElementById('search-input');
            if (searchInput && searchInput.value.trim() !== '' && !searchInput.disabled) {
                return;
            }

            const display = document.getElementById('main-display-list');

            const guestIds = new Set(lastGuestQueue.map(s => s.id));
            const spotifyOnly = (spotifyUpcomingQueue || []).filter(t => !guestIds.has(t.id));

            if (lastGuestQueue.length === 0 && spotifyOnly.length === 0) {
                setQueueDisplayHtml(display, '');
                return;
            }

            const guestRowsHtml = lastGuestQueue.map(song => {
                const isUpvoted = !!song.upvoted;

                return `
                    <div class="song-row">
                        <div class="song-details">
                            <img src="${safeImageUrl(song.artwork)}">
                            <div class="text-block">
                                <div class="title-wrapper">
                                    <p class="song-title">${escapeHtml(song.title)}</p>
                                    ${song.explicit ? '<span class="explicit-badge">E</span>' : ''}
                                </div>
                                <p class="song-artist">${escapeHtml(artistWithYear(song.artist, song.year))}</p>
                            </div>
                        </div>
                        <div class="actions">
                            <div class="vote-node ${isUpvoted ? 'user-voted-up' : ''}">
                                <button class="vote-btn vote-btn-up" data-id="${escapeHtml(song.id)}" onclick="castVote(this.dataset.id, 'up')">
                                    <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                                </button>
                                <span class="vote-count">${song.ups || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Spotify continuation rows fill out the queue beneath real guest
            // requests - rendered the same as any other row, no label or
            // divider singling them out.
            const spotifyRowsHtml = spotifyOnly.map(t => `
                <div class="song-row">
                    <div class="song-details">
                        <img src="${safeImageUrl(t.artwork)}">
                        <div class="text-block">
                            <div class="title-wrapper">
                                <p class="song-title">${escapeHtml(t.title)}</p>
                            </div>
                            <p class="song-artist">${escapeHtml(artistWithYear(t.artist, t.year))}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            setQueueDisplayHtml(display, guestRowsHtml + spotifyRowsHtml);
        }

        // Rebuilding #main-display-list's innerHTML unconditionally on every
        // 4-second poll (whether or not the queue actually changed) was
        // tearing down and recreating every row - images, buttons, all of
        // it - which is what caused the periodic flicker/glitch on this
        // screen. Only touching the DOM when the markup actually differs
        // fixes that.
        let lastRenderedQueueHtml = null;
        function setQueueDisplayHtml(display, html) {
            if (html === lastRenderedQueueHtml) return;
            lastRenderedQueueHtml = html;
            display.innerHTML = html;
        }

        async function castVote(id, type) {
            try {
                const res = await fetch(eventUrl('/api/vote'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, type, voterId: voterSignatureToken })
                });
                if (res.ok) fetchSystemState();
            } catch (e) { console.log("Voting entry exception dropped."); }
        }

        function executeSearch() {
            if (!systemRequestsAllowed || queueIsFull) return; // Prevent querying if system is locked down

            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value.trim();

            if (query === "") {
                fetchSystemState();
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(eventUrl(`/api/search?q=${encodeURIComponent(query)}`));
                    const data = await res.json();

                    document.getElementById('list-title').innerText = "Search Results";
                    const display = document.getElementById('main-display-list');

                    if (!data.tracks || data.tracks.length === 0) {
                        globalSearchResults = [];
                        display.innerHTML = '<p class="empty-placeholder">No matching songs found.</p>';
                        return;
                    }

                    globalSearchResults = data.tracks;

                    display.innerHTML = data.tracks.map((track, index) => `
                        <div class="song-row">
                            <div class="song-details">
                                <img src="${safeImageUrl(track.artwork)}">
                                <div class="text-block">
                                    <div class="title-wrapper">
                                        <p class="song-title">${escapeHtml(track.name)}</p>
                                        ${track.explicit ? '<span class="explicit-badge">E</span>' : ''}
                                    </div>
                                    <p class="song-artist">${escapeHtml(artistWithYear(track.artist, track.year))}</p>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-request" onclick="submitRequestAtIndex(${index})">Request</button>
                            </div>
                        </div>
                    `).join('');
                } catch (e) { console.log("Search extraction error"); }
            }, 300);
        }

        // Shared submission path used by both search results and the playlist browser,
        // so credits, explicit-locking, and error handling behave identically either way.
        async function submitTrackRequest(track) {
            if (!systemRequestsAllowed) {
                showToast("Submissions are currently closed.", "error");
                return false;
            }
            if (queueIsFull) {
                showToast("Queue is full right now — wait for a song or two to play, it'll reopen automatically.", "error");
                return false;
            }
            if (availableCredits <= 0) {
                showToast("You are out of credits! Wait for the regeneration cycle.", "error");
                return false;
            }
            try {
                // Dedicated kiosk endpoint - the server decides kiosk-vs-guest
                // rules by which route this hits, not by a flag we send, so a
                // regular guest page can't just claim isKiosk:true to borrow
                // the kiosk's credit/pause settings.
                const res = await fetch(eventUrl('/api/kiosk-request'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ track, username: guestUsername, voterId: voterSignatureToken })
                });

                if (res.ok) {
                    availableCredits--;
                    localStorage.setItem('userCredits', availableCredits);
                    updateCreditBadge(availableCredits);
                    restartLocalCountdown();
                    try { const okBody = await res.json(); lastRequestPending = !!(okBody && okBody.pending); } catch (e) { lastRequestPending = false; }
                    await fetchSystemState();
                    return true;
                } else {
                    const errorData = await res.json();
                    showToast(errorData.error || "Submission rejected.", "error");
                    return false;
                }
            } catch (e) {
                showToast("Failed to connect to request server.", "error");
                return false;
            }
        }

        let lastRequestPending = false;
        async function submitRequestAtIndex(index) {
            const track = globalSearchResults[index];
            if (!track) return;
            const ok = await submitTrackRequest(track);
            if (ok) {
                document.getElementById('search-input').value = "";
                showToast(lastRequestPending ? "Sent to the DJ for approval - it will show up once accepted." : "Song successfully added to the queue!", "success");
            }
        }

        fetchSystemState();
        setInterval(fetchSystemState, 4000);


        // Tapping the dimmed backdrop (not the modal box itself) closes whichever
        // popup is open - applies to every .modal-overlay on the page.
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) overlay.classList.remove('is-visible');
            });
        });

        // --- My Requests (guest-only view of their own request status) ---
        function statusLabel(status) {
            if (status === 'played') return 'Played';
            if (status === 'removed') return 'Dropped';
            return 'In Queue';
        }
        function statusClass(status) {
            if (status === 'played') return 'status-played';
            if (status === 'removed') return 'status-removed';
            return 'status-queued';
        }

        async function openMyRequestsModal() {
            document.getElementById('my-requests-modal').classList.add('is-visible');
            const body = document.getElementById('my-requests-body');
            body.innerHTML = '<p class="modal-loading">Loading your requests…</p>';

            try {
                const res = await fetch(eventUrl(`/api/my-requests?voterId=${encodeURIComponent(voterSignatureToken)}`));
                if (!res.ok) {
                    body.innerHTML = '<p class="modal-empty">Could not load your requests. Try again.</p>';
                    return;
                }
                const data = await res.json();
                const requests = data.requests || [];

                if (requests.length === 0) {
                    body.innerHTML = '<p class="modal-empty">You haven\'t requested any songs yet.</p>';
                    return;
                }

                body.innerHTML = requests.map(r => `
                    <div class="my-request-row">
                        <img src="${safeImageUrl(r.artwork)}">
                        <div class="my-request-text">
                            <p class="my-request-title">${escapeHtml(r.title)}</p>
                            <p class="my-request-artist">${escapeHtml(r.artist)}</p>
                        </div>
                        <span class="status-pill ${statusClass(r.status)}">${statusLabel(r.status)}</span>
                    </div>
                `).join('');
            } catch (e) {
                body.innerHTML = '<p class="modal-empty">Could not load your requests. Try again.</p>';
            }
        }

        function closeMyRequestsModal() {
            document.getElementById('my-requests-modal').classList.remove('is-visible');
        }



    </script>
    <div id="toast-container"></div>

    <!-- Now Playing bar - live from the DJ's connected Spotify account. The
         "up next" queue used to live in a slide-up panel toggled from here;
         it now renders inline in the Up Next view instead (see
         renderQueue() above), so this bar is just the current-track strip. -->
    <div class="now-playing-bar" id="now-playing-bar">
        <div class="now-playing-progress-track">
            <div class="now-playing-progress-fill" id="now-playing-progress-fill"></div>
        </div>
        <img class="now-playing-artwork" id="now-playing-artwork" src="" alt="">
        <div class="now-playing-text">
            <p class="now-playing-title" id="now-playing-title"></p>
            <p class="now-playing-artist" id="now-playing-artist"></p>
        </div>
        <div class="now-playing-live-dot" id="now-playing-live-dot"></div>
    </div>

    <script>
        // --- Now Playing bar: polls a cached, public endpoint (not Spotify
        // directly) so this stays cheap even with many guests' browsers open
        // at once. Hides itself entirely when nothing's playing, rather than
        // showing an empty/broken-looking bar.
        let nowPlayingState = null;
        let nowPlayingTicker = null;
        let nowPlayingLastTrackId = null;

        function renderNowPlayingProgress() {
            if (!nowPlayingState || !nowPlayingState.durationMs) return;
            const elapsed = nowPlayingState.isPlaying ? (Date.now() - nowPlayingState.fetchedAt) : 0;
            const pct = Math.min(100, ((nowPlayingState.progressMs + elapsed) / nowPlayingState.durationMs) * 100);
            const fillEl = document.getElementById('now-playing-progress-fill');
            if (fillEl) fillEl.style.width = pct + '%';
        }

        function updateNowPlayingBar(data) {
            const bar = document.getElementById('now-playing-bar');
            if (!bar) return;

            if (!data || !data.connected || !data.title) {
                bar.classList.remove('is-visible');
                document.body.classList.remove('has-now-playing-bar');
                nowPlayingState = null;
                nowPlayingLastTrackId = null;
                if (nowPlayingTicker) { clearInterval(nowPlayingTicker); nowPlayingTicker = null; }
                spotifyUpcomingQueue = [];
                renderQueue();
                return;
            }

            document.getElementById('now-playing-artwork').src = data.artwork || '';
            document.getElementById('now-playing-title').innerText = data.title;
            document.getElementById('now-playing-artist').innerText = data.artist || '';
            document.getElementById('now-playing-live-dot').classList.toggle('is-paused', !data.isPlaying);

            bar.classList.add('is-visible');
            document.body.classList.add('has-now-playing-bar');

            nowPlayingState = {
                progressMs: data.progressMs || 0,
                durationMs: data.durationMs || 0,
                isPlaying: !!data.isPlaying,
                fetchedAt: Date.now()
            };
            // Jump straight to the correct spot on every fresh poll (including
            // track changes) rather than letting it drift - renderNowPlayingProgress
            // sets width directly with no CSS transition, so this is instant.
            renderNowPlayingProgress();
            nowPlayingLastTrackId = data.trackId || null;

            if (!nowPlayingTicker) nowPlayingTicker = setInterval(renderNowPlayingProgress, 250);

            // Feeds the merged Up Next renderer (see renderQueue() above)
            // rather than drawing its own separate list - Spotify's live "up
            // next" now shows inline in the main queue view.
            spotifyUpcomingQueue = data.upcoming || [];
            renderQueue();
        }

        async function pollNowPlaying() {
            if (!EVENT_SLUG) return;
            try {
                const res = await fetch(eventUrl('/api/now-playing'));
                if (!res.ok) return;
                updateNowPlayingBar(await res.json());
            } catch (e) { /* keep last known state on a transient network hiccup */ }
        }

        pollNowPlaying();
        setInterval(pollNowPlaying, 4000);
    </script>


    <!-- Venue code box (small grey box, top right): appears when a guest taps "Display Code". Only active when this
         page was opened from the admin dashboard (the link carries ?screen=KEY). -->
    <div id="venue-code-screen" style="display:none; position:fixed; top:16px; right:16px; z-index:100000; background:rgba(58,58,58,0.95); color:#fff; border-radius:12px; padding:10px 16px 12px 16px; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,0.4); font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
        <div style="font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; color:#bdbdbd;">Venue Code</div>
        <div id="venue-code-screen-digits" style="font-size:1.9rem; font-weight:800; letter-spacing:0.18em; padding-left:0.18em; font-variant-numeric:tabular-nums; line-height:1.2;">------</div>
        <div id="venue-code-screen-timer" style="font-size:0.7rem; color:#bdbdbd; margin-top:2px;"></div>
    </div>
    <script>
        (function () {
            const key = new URLSearchParams(location.search).get('screen');
            if (!key) return;
            const slug = EVENT_SLUG;
            const box = document.getElementById('venue-code-screen');
            async function pollVenueCode() {
                try {
                    const res = await fetch('/e/' + encodeURIComponent(slug) + '/api/venue-code-display?screen=' + encodeURIComponent(key), { cache: 'no-store' });
                    if (!res.ok) return;
                    const d = await res.json();
                    if (d.show) {
                        document.getElementById('venue-code-screen-digits').textContent = d.code;
                        document.getElementById('venue-code-screen-timer').textContent = d.secondsLeft + 's left';
                        box.style.display = 'flex';
                    } else {
                        box.style.display = 'none';
                    }
                } catch (e) { /* keep current state */ }
            }
            pollVenueCode();
            setInterval(pollVenueCode, 3000);
        })();
    </script>
    <script>
        // Slugless /kiosk: no event chosen on this device yet -> pick one. Once picked it is remembered, so the
        // installed app just opens straight to it. To switch a kiosk to another event later, tap the title 5 times.
        (function () {
            if (EVENT_SLUG) {
                var h = document.getElementById('event-name-header'), taps = [];
                if (h) h.addEventListener('click', function () {
                    var n = Date.now();
                    taps = taps.filter(function (t) { return n - t < 2500; });
                    taps.push(n);
                    if (taps.length >= 5) {
                        taps = [];
                        if (confirm('Switch this kiosk to a different event?')) {
                            try { localStorage.removeItem(KIOSK_EVENT_KEY); } catch (e) { /* ignore */ }
                            location.replace('/kiosk');
                        }
                    }
                });
                return;
            }
            var css = document.createElement('style');
            css.textContent = '#kiosk-picker{position:fixed;inset:0;z-index:100001;background:#121212;color:#fff;display:flex;flex-direction:column;align-items:center;padding:0 24px 24px;overflow-y:auto;font-family:-apple-system,BlinkMacSystemFont,sans-serif}' +
                '#kiosk-picker .kp-head{position:sticky;top:0;z-index:2;width:100%;background:#121212;text-align:center;padding:24px 0 4px;display:flex;flex-direction:column;align-items:center}' +
                '#kiosk-picker h2{margin:12px 0 6px}#kiosk-picker p{color:#a7a7a7;margin:0 0 16px}' +
                '#kiosk-picker input{width:100%;max-width:460px;padding:12px 14px;border-radius:8px;border:1px solid #333;background:#242424;color:#fff;font-size:1rem;margin-bottom:12px;box-sizing:border-box}' +
                '#kiosk-picker .kp-list{width:100%;max-width:460px;display:flex;flex-direction:column;gap:8px}' +
                '#kiosk-picker button{text-align:left;background:#181818;border:1px solid #282828;color:#fff;border-radius:10px;padding:14px;font-size:1rem;cursor:pointer}' +
                '#kiosk-picker button:hover{border-color:#1DB954}#kiosk-picker small{display:block;color:#a7a7a7;margin-top:2px}';
            document.head.appendChild(css);
            var box = document.createElement('div');
            box.id = 'kiosk-picker';
            box.innerHTML = '<div class="kp-head"><h2>Choose this kiosk\u2019s event</h2><p>You only need to do this once on this device.</p><input id="kp-search" type="search" placeholder="Search events\u2026" autocomplete="off"></div><div class="kp-list" id="kp-list">Loading\u2026</div>';
            document.body.appendChild(box);
            var venues = [];
            function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
            function paint() {
                var q = document.getElementById('kp-search').value.trim().toLowerCase();
                var list = venues.filter(function (v) { return !q || (v.eventName + ' ' + (v.venueName || '') + ' ' + v.slug).toLowerCase().indexOf(q) !== -1; });
                var el = document.getElementById('kp-list');
                el.innerHTML = list.length ? list.map(function (v) {
                    return '<button type="button" data-slug="' + esc(v.slug) + '">' + esc(v.eventName || v.slug) + (v.venueName ? '<small>' + esc(v.venueName) + '</small>' : '') + '</button>';
                }).join('') : 'No events found.';
            }
            document.getElementById('kp-search').addEventListener('input', paint);
            document.getElementById('kp-list').addEventListener('click', function (e) {
                var b = e.target.closest('button[data-slug]');
                if (!b) return;
                try { localStorage.setItem(KIOSK_EVENT_KEY, b.dataset.slug); } catch (err) { /* ignore */ }
                location.replace('/kiosk');
            });
            fetch('/api/venues').then(function (r) { return r.json(); }).then(function (d) { venues = d.venues || []; paint(); })
                .catch(function () { document.getElementById('kp-list').textContent = 'Could not load events. Check the connection and reload.'; });
        })();
    </script>
    <script>
        // Keeps the page content clear of the pinned top bar: copies the header's real height
        // into --fixed-header-h whenever it changes (long titles, subtitle, rotation, display-only mode).
        (function () {
            var h = document.querySelector('.pinned-top');
            if (!h) return;
            function sync() { document.documentElement.style.setProperty('--fixed-header-h', h.offsetHeight + 'px'); }
            sync();
            if (window.ResizeObserver) new ResizeObserver(sync).observe(h);
            window.addEventListener('resize', sync);
            window.addEventListener('load', sync);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(sync);
        })();
    </script>
